name: Generate emerald contribution trail

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: contribution-trail
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate emerald contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Vignesh-23-09
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2334D399&color_dots=%2307110D,%23064E3B,%23047857,%2310B981,%236EE7B7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%236EE7B7&color_dots=%2307110D,%23064E3B,%23047857,%2310B981,%2334D399
            dist/github-contribution-grid-snake-light.svg?palette=github&color_snake=%23047857&color_dots=%23ECFDF5,%23A7F3D0,%236EE7B7,%2310B981,%23065F46

      - name: Publish SVG animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
